# Builds the React dashboard (dahsboard/dashboard-app) and publishes it on GitHub Pages.
# Runs on every push to main that changes the dashboard, and can be started by hand (Actions tab -> Run workflow).
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["dahsboard/**", ".github/workflows/deploy-dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dahsboard/dashboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dahsboard/dashboard-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
